name: ARM-VO CI Pipeline

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  static-analysis:
    name: Static analysis
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install Cppcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cppcheck=2.13.0-2ubuntu3
          cppcheck --version

      - name: Run Cppcheck
        run: |
          # Error checks are always enabled; add correctness warnings only.
          cppcheck \
            --enable=warning,performance \
            --suppress=useInitializationList \
            --error-exitcode=1 \
            --std=c++17 \
            --language=c++ \
            --template=gcc \
            --suppress=missingIncludeSystem \
            --suppress='*:cli/include/cxxopts.hpp' \
            -I lib/include \
            -I lib/include/armvo \
            -I lib/src \
            -I tools/include \
            -I tools/include/armvo/tools \
            -I cli/include \
            lib/src tools/src cli/src

  build-and-test:
    needs: static-analysis
    runs-on: ubuntu-24.04

    steps:
      - name: Install dependencies
        run: |
          echo "::group::CMake and Build Tools"
          sudo apt-get update
          sudo apt install -y --no-install-recommends build-essential git cmake pkg-config
          echo "::endgroup::"

          echo "::group::Prebuilt OpenCV and ncnn conversion tool dependencies"
          sudo apt install -y --no-install-recommends libopencv-dev libprotobuf-dev protobuf-compiler
          echo "::endgroup::"

          echo "::group::Python bindings"
          sudo apt install -y --no-install-recommends python3-dev python3-numpy pybind11-dev
          echo "::endgroup::"

      - name: Checkout code
        uses: actions/checkout@v5

      - name: Build
        run: |
          mkdir build && cd build
          cmake -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=ON -DBUILD_PYTHON_BINDINGS=ON ..
          make -j$(nproc)

      - name: Run tests
        run: ctest --test-dir build/_armvo --output-on-failure
