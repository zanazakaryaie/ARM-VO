name: ARM-VO CI Pipeline

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-analysis:
    name: Static analysis
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install Cppcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cppcheck=2.13.0-2ubuntu3
          cppcheck --version

      - name: Run Cppcheck
        run: |
          # Error checks are always enabled; add correctness warnings only.
          cppcheck \
            --enable=warning,performance \
            --suppress=useInitializationList \
            --error-exitcode=1 \
            --std=c++17 \
            --language=c++ \
            --template=gcc \
            --suppress=missingIncludeSystem \
            --suppress='*:cli/include/cxxopts.hpp' \
            -I lib/include \
            -I lib/include/armvo \
            -I lib/src \
            -I tools/include \
            -I tools/include/armvo/tools \
            -I cli/include \
            lib/src tools/src cli/src

  build-and-test:
    name: Build and test (${{ matrix.arch }})
    needs: static-analysis
    permissions:
      contents: read
      packages: write
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            segmentation_args: ""
          - arch: arm64
            runner: ubuntu-24.04-arm
            segmentation_args: "-DSEG_WIDTH=320 -DSEG_HEIGHT=160 -DSEG_PRECISION=fp16"
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Select dependency image
        env:
          DEPENDENCY_HASH: ${{ hashFiles('.github/ci/Dockerfile', '.github/ci/Dockerfile.dockerignore', '.github/ci/CMakeLists.txt', '3rd-party/**', 'cmake/**') }}
          ARCH: ${{ matrix.arch }}
        run: |
          echo "CI_IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/ci-deps:${ARCH}-${DEPENDENCY_HASH}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Pull or build dependency image
        id: image
        run: |
          if docker pull "$CI_IMAGE"; then
            echo "built=false" >> "$GITHUB_OUTPUT"
          else
            echo "Dependency image unavailable; building it from source."
            docker build --file .github/ci/Dockerfile \
              --build-arg "SOURCE_URL=https://github.com/$GITHUB_REPOSITORY" \
              --tag "$CI_IMAGE" .
            echo "built=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        env:
          SEGMENTATION_ARGS: ${{ matrix.segmentation_args }}
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --env SEGMENTATION_ARGS \
            "$CI_IMAGE" bash -euc '
              mkdir -p build && cd build
              cmake -DCMAKE_BUILD_TYPE=Release -DINFERENCE_BACKEND=NCNN \
                -DBUILD_TESTS=ON -DBUILD_PYTHON_BINDINGS=ON $SEGMENTATION_ARGS ..
              make -j"$(nproc)"
            '

      - name: Run tests
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            "$CI_IMAGE" ctest --test-dir build/_armvo --output-on-failure --no-tests=error

      - name: Publish dependency image
        if: steps.image.outputs.built == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        run: docker push "$CI_IMAGE"

      - name: Log out of GHCR
        if: always()
        run: docker logout ghcr.io
